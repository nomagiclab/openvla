# OpenVLA Fine-tuning Default Configuration
# This file contains the default values used by finetune.py
# These values should only be changed when updating the baseline defaults

[MODEL_AND_DATASET]
VLA_PATH=openvla/openvla-7b
RUN_ROOT_DIR=.runs/
ADAPTER_TMP_DIR=.adapter/

[DATASET]
DATA_ROOT_DIR=data
DATASET_NAME=robotgeneralist/nomagic-simple-box
TOLERANCE_S=0.01
REVISION=
DOWNLOAD_VIDEOS=False
LOCAL_FILES_ONLY=True 

[TRAINING]
BATCH_SIZE=16
MAX_STEPS=25000
SAVE_STEPS=1000
LEARNING_RATE=5e-4
GRAD_ACCUMULATION_STEPS=1
IMAGE_AUG=True
SHUFFLE_BUFFER_SIZE=1000
SAVE_LATEST_CHECKPOINT_ONLY=False

[LORA]
USE_LORA=True
LORA_RANK=32
LORA_DROPOUT=0.1
USE_QUANTIZATION=False

[WANDB]
WANDB_PROJECT=openvla
WANDB_ENTITY=robotgeneralist
WANDB_EXPERIMENT_NAME=finetune-nomagic-simple-box