# OpenVLA Fine-tuning Configuration
# Edit this file to customize your fine-tuning run

[MODEL]
VLA_PATH=openvla/openvla-7b                # Path to the OpenVLA model to fine-tune
                                           # (HuggingFace model ID or local path)
RUN_ROOT_DIR=.runs/                        # Directory where training logs and 
                                           # checkpoints will be saved
ADAPTER_TMP_DIR=.adapter/                  # Temporary directory for storing adapter 
                                           # weights during LoRA fine-tuning

[DATASET]
DATA_ROOT_DIR=data                         # Root directory for storing datasets
                                           # Maps to 'root' parameter in LeRobotDataset
DATASET_NAME=robotgeneralist/nomagic-simple-box  # Dataset identifier for fine-tuning
                                           # Maps to 'repo_id' parameter in LeRobotDataset
                                           # Stored as subdirectory of DATA_ROOT_DIR
TOLERANCE_S=0.01                           # Time tolerance in seconds for alignment
                                           # Maps to 'tolerance_s' in LeRobotDataset
                                           # Controls timestamp alignment between
                                           # observations and actions
REVISION=main                              # Dataset revision to use
                                           # Maps to 'revision' in LeRobotDataset
                                           # Use "main" for latest or specify a
                                           # particular revision hash/tag
DOWNLOAD_VIDEOS=False                      # Whether to download videos from Hugging Face
                                           # Maps to 'download_videos' in LeRobotDataset
LOCAL_FILES_ONLY=True                      # Whether to use only local dataset files
                                           # Similar to 'force_cache_sync' in LeRobotDataset
                                           # When True, won't download from Hugging Face

[TRAINING]
BATCH_SIZE=1                               # Number of samples per GPU per 
                                           # optimization step. Larger values use more 
                                           # GPU memory but may improve training 
                                           # stability. For a 48GB GPU, a batch size 
                                           # of 12 is feasible. For an 80GB GPU, a 
                                           # batch size of 24 is feasible
GRAD_ACCUMULATION_STEPS=16                 # Number of gradient accumulation steps 
                                           # before performing an optimizer update.
                                           # Increase this value to simulate larger 
                                           # batch sizes with limited GPU memory
LEARNING_RATE=5e-4                         # Learning rate for the AdamW optimizer.
                                           # Default uses a constant learning rate 
                                           # schedule
MAX_STEPS=25000                            # Maximum number of optimization steps to 
                                           # train for
SAVE_STEPS=1000                            # Save a checkpoint every SAVE_STEPS 
                                           # optimization steps
SAVE_LATEST_CHECKPOINT_ONLY=False          # Whether to only save the latest checkpoint
                                           # (True) or keep all checkpoints (False).
                                           # Set to True to save disk space, False to 
                                           # keep a history of model checkpoints
IMAGE_AUG=True                             # Whether to apply image augmentation 
                                           # during training. Set to False if 
                                           # fine-tuning on a dataset the model was 
                                           # already trained on. Set to True to improve
                                           # generalization on new datasets

[LORA]
LORA_RANK=32                               # Rank of the LoRA adaptation matrices.
                                           # Higher values (16-64) provide more 
                                           # capacity but require more memory and 
                                           # computation. Lower values (4-8) are more 
                                           # efficient but may limit adaptation 
                                           # capability
LORA_DROPOUT=0.1                           # Dropout probability for LoRA layers.
                                           # Higher values (0.1-0.2) can help prevent 
                                           # overfitting
USE_LORA=True                              # Whether to use LoRA (Low-Rank Adaptation)
                                           # for parameter-efficient fine-tuning.
                                           # Recommended for most fine-tuning scenarios
                                           # to reduce memory usage and training time
USE_QUANTIZATION=False                     # Whether to use 4-bit quantization during 
                                           # training (requires LoRA). Enables 
                                           # fine-tuning on GPUs with limited memory 
                                           # but may affect model quality

[DISTRIBUTED]
NPROC_PER_NODE=1                           # Number of processes (GPUs) to use per 
                                           # node. Set to the number of available GPUs
                                           # for multi-GPU training

[WANDB]
WANDB_ENTITY=robotgeneralist               # Weights & Biases entity (username or team
                                           # name) for logging
WANDB_PROJECT=openvla                      # Weights & Biases project name for logging
WANDB_EXPERIMENT_NAME=finetune-nomagic-simple-box  # Name of the experiment for logging